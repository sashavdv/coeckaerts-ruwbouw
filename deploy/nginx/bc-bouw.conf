# nginx-config voor de statische BC Bouw-site.
#
# Installeren (op de Hetzner-server):
#   sudo cp bc-bouw.conf /etc/nginx/sites-available/bc-bouw.conf
#   sudo ln -s /etc/nginx/sites-available/bc-bouw.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bc-bouw.be -d www.bc-bouw.be
#
# Certbot vult de `listen 443 ssl`- en certificaatregels zelf aan.
# Vervang bc-bouw.be overal als er een andere domeinnaam gekozen wordt.

# bc-bouw.be (zonder www) -> www.bc-bouw.be
server {
    listen 80;
    listen [::]:80;
    server_name bc-bouw.be;
    return 301 https://www.bc-bouw.be$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.bc-bouw.be;

    root /var/www/bc-bouw;
    index index.html;

    # --- Preview-fase: wachtwoord zolang Ward de site nog niet goedkeurde -------
    # Maak het wachtwoordbestand aan met:
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd-bc-bouw ward
    # Verwijder deze twee regels wanneer de site live gaat.
    auth_basic "BC Bouw preview";
    auth_basic_user_file /etc/nginx/.htpasswd-bc-bouw;
    # ---------------------------------------------------------------------------

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gehashte bestanden van Astro (CSS, JS, geoptimaliseerde foto's): 1 jaar cachen.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|svg|ico|webp|avif|woff2)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
